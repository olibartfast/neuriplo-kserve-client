name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

jobs:
  format-check:
    name: Format Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install clang-format
        run: pip install clang-format==21.1.8
      - name: Check formatting
        run: |
          git ls-files 'src/*.cpp' 'src/*.hpp' 'include/*.hpp' 'test/*.cpp' | \
            xargs clang-format --dry-run --Werror

  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        grpc: [ON, OFF]
        proto_profile: [OIP_REPOSITORY, OIP]
    name: build (gRPC=${{ matrix.grpc }}, proto=${{ matrix.proto_profile }})
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ ninja-build ccache libssl-dev \
            libgrpc++-dev libprotobuf-dev protobuf-compiler protobuf-compiler-grpc

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ github.job }}-${{ runner.os }}-${{ matrix.grpc }}-${{ matrix.proto_profile }}

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DKSERVE_CLIENT_BUILD_TESTS=ON
          -DKSERVE_CLIENT_ENABLE_GRPC=${{ matrix.grpc }}
          -DKSERVE_CLIENT_PROTO_PROFILE=${{ matrix.proto_profile }}

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Conformance dry-run
        run: ctest --test-dir build --output-on-failure -L conformance
